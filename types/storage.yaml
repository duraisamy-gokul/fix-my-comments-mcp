Storage:
  WorkspaceIdentity:
    description: Workspace identity derived from repo root and Git branch
    type: object
    required: [repoRoot, branch, storagePath]
    properties:
      repoRoot:
        description: Absolute path to the repository root
        type: string
      branch:
        description: Current Git branch name
        type: string
      storagePath:
        description: >
          Absolute path under ~/.fixmycomments where this repo+branch's data
          lives. Shared verbatim with the fix-my-comments-mcp server.
        type: string

  ThreadFile:
    description: Root shape of the threads.json storage file
    type: object
    required: [schemaVersion, threads]
    properties:
      schemaVersion:
        description: Storage schema version
        type: number
      threads:
        description: All review threads for this workspace and branch
        type: array
        items:
          $ref: './types/task.yaml#/Task/ReviewThread'

  ReviewMessageFile:
    description: Root shape of the messages.json storage file
    type: object
    required: [schemaVersion, messages]
    properties:
      schemaVersion:
        description: Storage schema version
        type: number
      messages:
        description: All thread messages across threads for this workspace and branch
        type: array
        items:
          $ref: './types/task.yaml#/Task/ReviewMessage'
